[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "realmarket-mcp"
version = "0.1.7"
description = "An MCP server that lets LLMs research markets with verified data, data-quality checks and inflation-adjusted (real) returns."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "realmarket-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "llm", "finance", "inflation", "real-returns"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.7",
]

[project.scripts]
realmarket-mcp = "realmarket_mcp.server:main"
realmarket-qualify = "realmarket_mcp.qualify:main"
realmarket-adapter-check = "realmarket_mcp.adapter_check:main"

[project.optional-dependencies]
yahoo = ["yfinance>=1.5"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/realmarket_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Turkish questions and advice wording: the dotless ı is the correct letter there.
"src/realmarket_mcp/qualify.py" = ["RUF001", "RUF003"]
"tests/test_qualify.py" = ["RUF001", "RUF003"]
"src/realmarket_mcp/tr_reference.py" = ["RUF001", "RUF003"]
"src/realmarket_mcp/facts.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_facts.py" = ["RUF001", "RUF003"]
"tests/test_valuation.py" = ["RUF001", "RUF003"]
"tests/test_event_reaction.py" = ["RUF001", "RUF003"]
"tests/test_portfolio.py" = ["RUF001", "RUF003"]
"tests/test_financials.py" = ["RUF001", "RUF003"]
"tests/test_price_move.py" = ["RUF001", "RUF003"]
"tests/test_house_prices.py" = ["RUF001", "RUF003"]
"tests/test_tools.py" = ["RUF001", "RUF003"]
"tests/test_real_return.py" = ["RUF001", "RUF003"]
"tests/test_portfolio_analysis.py" = ["RUF001", "RUF003"]
"tests/test_foreign_sources.py" = ["RUF001", "RUF003"]

[tool.mypy]
files = ["src/realmarket_mcp"]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true
