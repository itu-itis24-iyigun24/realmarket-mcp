[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "realmarket-mcp"
version = "0.1.1"
description = "An MCP server that lets LLMs research markets with verified data, data-quality checks and inflation-adjusted (real) returns."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "realmarket-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "llm", "finance", "inflation", "real-returns"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.7",
]

[project.scripts]
realmarket-mcp = "realmarket_mcp.server:main"

[project.optional-dependencies]
yahoo = ["yfinance>=1.5"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/realmarket_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src/realmarket_mcp"]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true
